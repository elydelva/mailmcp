name: SonarCloud

# Not triggered automatically — run manually from the Actions tab or via API.
# Requires SONAR_TOKEN secret to be configured in repository settings.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or SHA to analyse (default: current branch)"
        required: false
        default: ""

jobs:
  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0 # Required for blame & new-code detection

      - uses: oven-sh/setup-bun@735343b667c96514a659bd9b968db9a61e574ea6 # v2
        with:
          bun-version-file: ".bun-version"

      - name: Cache dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests with coverage
        run: bun test --coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@49e6cd3b187936a73b8280d59ffd9da69df63ec9 # v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
