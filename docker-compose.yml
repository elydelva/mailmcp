services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mailmcp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailmcp"]
      interval: 5s
      retries: 10

  hydra-migrate:
    image: oryd/hydra:v2.2.0
    command: migrate sql -e --yes
    environment:
      DSN: postgres://mailmcp:${POSTGRES_PASSWORD}@postgres:5432/hydra?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  hydra:
    image: oryd/hydra:v2.2.0
    restart: unless-stopped
    command: serve all
    environment:
      DSN: postgres://mailmcp:${POSTGRES_PASSWORD}@postgres:5432/hydra?sslmode=disable
      URLS_SELF_ISSUER: https://${HYDRA_DOMAIN}
      URLS_CONSENT: https://${AUTH_UI_DOMAIN}/consent
      URLS_LOGIN: https://${AUTH_UI_DOMAIN}/login
      URLS_LOGOUT: https://${AUTH_UI_DOMAIN}/logout
      SECRETS_SYSTEM: ${HYDRA_SECRET}
      OIDC_DYNAMIC_CLIENT_REGISTRATION_ENABLED: "true"
      OIDC_DYNAMIC_CLIENT_REGISTRATION_DEFAULT_SCOPE: openid,offline_access
      OAUTH2_PKCE_ENFORCED_FOR_PUBLIC_CLIENTS: "true"
      STRATEGIES_ACCESS_TOKEN: opaque
      TTL_ACCESS_TOKEN: 1h
      TTL_REFRESH_TOKEN: 720h
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully
    expose:
      - "4444"
      - "4445"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hydra.rule=Host(`${HYDRA_DOMAIN}`)"
      - "traefik.http.routers.hydra.entrypoints=websecure"
      - "traefik.http.routers.hydra.tls.certresolver=letsencrypt"
      - "traefik.http.services.hydra.loadbalancer.server.port=4444"

  hydra-ui:
    image: oryd/hydra-login-consent-node:latest
    restart: unless-stopped
    environment:
      HYDRA_ADMIN_URL: http://hydra:4445
    expose:
      - "3000"
    depends_on:
      - hydra
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hydra-ui.rule=Host(`${AUTH_UI_DOMAIN}`)"
      - "traefik.http.routers.hydra-ui.entrypoints=websecure"
      - "traefik.http.routers.hydra-ui.tls.certresolver=letsencrypt"
      - "traefik.http.services.hydra-ui.loadbalancer.server.port=3000"

  mailmcp:
    image: ghcr.io/${GHCR_REPO:-elydelva/mailmcp}:${IMAGE_TAG:-main}
    restart: unless-stopped
    environment:
      SERVER_BASE_URL: https://${MCP_DOMAIN}
      HYDRA_PUBLIC_URL: https://${HYDRA_DOMAIN}
      HYDRA_ADMIN_URL: http://hydra:4445
      STORAGE_BACKEND: postgres
      DATABASE_URL: postgres://mailmcp:${POSTGRES_PASSWORD}@postgres:5432/mcp_mail?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      hydra:
        condition: service_started
    expose:
      - "3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailmcp.rule=Host(`${MCP_DOMAIN}`)"
      - "traefik.http.routers.mailmcp.entrypoints=websecure"
      - "traefik.http.routers.mailmcp.tls.certresolver=letsencrypt"
      - "traefik.http.services.mailmcp.loadbalancer.server.port=3000"

  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt

volumes:
  postgres_data:
  letsencrypt:
